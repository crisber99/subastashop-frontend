<app-landing-teaser></app-landing-teaser>
<app-promotion-banner *ngIf="!launchMode"></app-promotion-banner>

@if (isAuthPage()) {
<div class="auth-wrapper">
    <router-outlet></router-outlet>
</div>
} @else {
<div class="app-wrapper" [class.sidebar-collapsed]="!layoutService.sidebarOpen()">

    <!-- BANNER PWA INSTALL -->
    <div *ngIf="showInstallButton" class="alert alert-info alert-dismissible fade show m-0 text-center rounded-0 border-0 d-flex align-items-center justify-content-center gap-3" style="background: linear-gradient(90deg, #4f46e5, #6366f1); color: white; z-index: 1050; position: relative;">
      <i class="bi bi-download fs-4"></i>
      <div>
        <strong>¡Instala SubastaShop!</strong> 
        <span class="d-none d-md-inline ms-1">Disfruta de una mejor experiencia y acceso rápido.</span>
      </div>
      <button (click)="installPwa()" class="btn btn-light btn-sm fw-bold rounded-pill px-3 shadow-sm ms-3">Instalar</button>
      <button type="button" class="btn-close btn-close-white" (click)="showInstallButton = false" aria-label="Close"></button>
    </div>

    @if (authService.isLoggedIn()) {
      <app-sidebar></app-sidebar>
    }

    <div class="main-content">
        @if (authService.isLoggedIn()) {
        <app-navbar></app-navbar>
        }

        <div class="content-body">
            <router-outlet></router-outlet>
        </div>

        <app-footer></app-footer>
    </div>

    <!-- Carrito Flotante Global -->
    <app-cart-float></app-cart-float>

    <!-- Botón de Feedback / Soporte WhatsApp Beta -->
    <a [href]="getWhatsAppUrl()"
        target="_blank" class="whatsapp-float shadow-lg animate__animated animate__pulse animate__infinite"
        title="Soporte Beta (WhatsApp)">
        <i class="bi bi-whatsapp"></i>
    </a>

    <!-- Chat de Soporte IA (CONGELADO TEMPORALMENTE)
        @if (authService.isLoggedIn()) {
            <app-ai-support-chat></app-ai-support-chat>
        }
        -->
</div>
}

@if (loaderService.isLoading()) {
<div class="loader-overlay d-flex flex-column align-items-center justify-content-center">
    <div class="loader-brand-wrapper">
        <img src="assets/img/subasta_shop_icon.png" alt="SubastaShop" class="loader-pulse-logo">
        <div class="loader-glow"></div>
    </div>
    <h4 class="mt-4 fw-bold text-white letter-spacing-2 animate__animated animate__pulse animate__infinite">SubastaShop
    </h4>
</div>
}

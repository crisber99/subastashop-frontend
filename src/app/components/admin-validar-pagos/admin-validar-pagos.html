<div class="card shadow-sm" style="background: var(--card-bg); border-color: var(--glass-border);">
    <div class="card-header d-flex justify-content-between align-items-center"
         style="background: var(--glass-bg); border-color: var(--glass-border);">
      <h5 class="mb-0" style="color: var(--text-color);">🏦 Validación de Pagos por Transferencia</h5>
      <button class="btn btn-sm btn-outline-primary rounded-pill px-3" (click)="cargarPendientes()" [disabled]="loading">
        <i class="bi bi-arrow-clockwise" [class.spinner-border]="loading"></i> Actualizar Listado
      </button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table mb-0" style="color: var(--text-color);">
          <thead style="background: var(--glass-bg);">
            <tr style="border-color: var(--glass-border);">
              <th style="color: var(--primary-color);">ID ORDEN</th>
              <th style="color: var(--primary-color);">CLIENTE</th>
              <th style="color: var(--primary-color);">TIENDA</th>
              <th style="color: var(--primary-color);">MONTO</th>
              <th style="color: var(--primary-color);">COMPROBANTE</th>
              <th style="color: var(--primary-color); text-align: center;">VALORAR PAGO</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let o of ordenes" style="border-color: var(--glass-border); vertical-align: middle;">
              <td><span class="badge bg-dark fw-bold">#{{ o.id }}</span></td>
              <td>
                <div class="d-flex flex-column text-start">
                    <span class="fw-bold">{{ o.usuario?.nombreCompleto || 'Invitado' }}</span>
                    <small class="text-muted">{{ o.usuario?.email }}</small>
                </div>
              </td>
              <td><small class="opacity-75">{{ o.tienda?.nombre }}</small></td>
              <td><strong class="text-success fs-5">${{ o.total | number }}</strong></td>
              <td>
                <button class="btn btn-sm btn-outline-info rounded-pill px-3 shadow-sm" (click)="verComprobante(o.comprobanteUrl)">
                    <i class="bi bi-image me-1"></i> Ver Captura
                </button>
              </td>
              <td class="text-center">
                <div class="btn-group shadow-sm">
                    <button (click)="aprobar(o.id)" class="btn btn-success px-3" title="Aprobar Pago">
                        <i class="bi bi-check-circle-fill"></i>
                    </button>
                    <button (click)="rechazar(o.id)" class="btn btn-danger px-3" title="Rechazar Pago">
                        <i class="bi bi-x-circle-fill"></i>
                    </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="ordenes.length === 0 && !loading">
              <td colspan="6" class="text-center py-5">
                <div class="display-1 text-success opacity-50 mb-3"><i class="bi bi-check2-all"></i></div>
                <h4 class="fw-bold opacity-75">¡Todo al día!</h4>
                <p class="text-muted">No hay pagos pendientes de revisión en este momento.</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
</div>

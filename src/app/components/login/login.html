<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-12 col-md-6 col-lg-5 col-xl-4">
      
      <div class="auth-card animate__animated animate__zoomIn">
        <div class="auth-header">
          <div class="brand-icon">🚀</div>
          <h3>¡Bienvenido!</h3>
          <p>Potenciando tus subastas favoritas.</p>
        </div>

        <div class="auth-body">
          <div *ngIf="mensajeError" class="alert alert-danger border-0 shadow-sm animate__animated animate__shakeX">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ mensajeError }}
          </div>

          <form (ngSubmit)="onLogin()">
            <div class="mb-4">
              <label class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control" [(ngModel)]="email" name="email" 
                     placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-4">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" [(ngModel)]="password" name="password" 
                     placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-auth" [disabled]="cargando">
              <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
              {{ cargando ? 'Iniciando...' : 'Iniciar Sesión' }}
            </button>
          </form>

          <div class="auth-footer">
            ¿No tienes una cuenta? 
            <a routerLink="/registro">Crea una ahora</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<nav class="navbar navbar-expand shadow-sm px-4 sticky-top">
    
    <div class="d-flex align-items-center">
        <button id="sidebar-toggle-btn" class="btn toggle-btn me-2" (click)="toggleSidebar()">
            <i class="bi bi-list fs-3"></i>
        </button>
        <a routerLink="/" class="navbar-brand d-flex align-items-center ms-2 animate__animated animate__fadeIn">
            <img src="assets/img/subasta_shop_icon.png" alt="SubastaShop" style="width: 35px;" class="brand-alive">
            <span class="ms-2 fw-800 fs-4 d-none d-sm-inline" style="color: var(--text-color); letter-spacing: -1px;">
                Subasta<span style="color: var(--primary-color);">Shop</span>
            </span>
        </a>
    </div>

    <div class="navbar-collapse collapse">
        <div class="ms-auto d-flex align-items-center">
            
            <!-- Cómo Funciona -->
            <a routerLink="/como-funciona" class="btn btn-surface me-3 shadow-sm border-0 d-none d-md-inline-flex align-items-center fw-bold" 
               style="color: var(--primary-color);" title="Guía Rápida: Cómo usar SubastaShop">
               <i class="bi bi-info-circle-fill me-2"></i> Cómo Funciona
            </a>

            <!-- Selector de Tema (Global) -->
            <button class="btn btn-surface me-3 shadow-sm border-0" (click)="themeService.toggleTheme()" 
                    [title]="themeService.isDarkMode() ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'">
                <i class="bi" [ngClass]="themeService.isDarkMode() ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill text-primary'"></i>
            </button>

            <!-- Botón Carrito en Navbar -->
            <button id="cart-button-desktop" class="btn btn-surface position-relative me-4 shadow-sm border-0 d-none d-md-block" 
                    data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
                <i class="bi bi-cart3 fs-5"></i>
                <span *ngIf="cartService.cantidadItems() > 0"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border-2 border-danger-subtle">
                    {{ cartService.cantidadItems() }}
                </span>
            </button>

            @if (authService.isLoggedIn()) {
            <span class="small fw-bold me-3" style="color: var(--text-color);">
                {{ authService.currentUser()?.alias || authService.currentUser()?.nombre || authService.currentUser()?.email }} 
            </span>

            <!-- Botón Cerrar Sesión -->
            <button class="btn btn-outline-danger btn-sm rounded-pill shadow-sm d-flex align-items-center" 
                    (click)="authService.logout()" title="Cerrar Sesión">
                <i class="bi bi-power me-1"></i>
                <span class="d-none d-md-inline">Salir</span>
            </button>
            } @else {
            <a routerLink="/login" class="btn btn-primary btn-sm rounded-pill shadow-sm me-2 fw-bold px-3">
                <i class="bi bi-person me-1"></i> Iniciar Sesión
            </a>
            <a routerLink="/register" class="btn btn-outline-secondary btn-sm rounded-pill shadow-sm fw-bold px-3 d-none d-sm-inline-block">
                Regístrate
            </a>
            }
        </div>
    </div>
</nav>

<!-- El dropdown ha sido removido a petición del usuario para simplificar la interfaz. 
     La sesión se gestiona ahora exclusivamente desde la barra lateral. -->

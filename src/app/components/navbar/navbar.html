<nav class="navbar navbar-expand navbar-light shadow-sm px-4">
    
    <button class="btn toggle-btn me-3" (click)="toggleSidebar()">
        <i class="bi bi-list fs-3"></i>
    </button>

    <div class="navbar-collapse collapse">
        <div class="ms-auto d-flex align-items-center">
            
            <!-- Selector de Tema (Global) -->
            <button class="btn btn-light me-3 shadow-sm" (click)="themeService.toggleTheme()" 
                    [title]="themeService.isDarkMode() ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'">
                <i class="bi" [ngClass]="themeService.isDarkMode() ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill text-primary'"></i>
            </button>

            <!-- Botón Carrito en Navbar -->
            <button class="btn btn-light position-relative me-4 shadow-sm" 
                    data-bs-toggle="modal" data-bs-target="#modalCarrito">
                <i class="bi bi-cart3 fs-5"></i>
                <span *ngIf="cartService.cantidadItems() > 0"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light">
                    {{ cartService.cantidadItems() }}
                </span>
            </button>

            <span class="text-muted small fw-bold">
                {{ authService.currentUser()?.nombre || authService.currentUser()?.email }} 
            </span>
        </div>
    </div>
</nav>

<!-- El dropdown ha sido removido a petición del usuario para simplificar la interfaz. 
     La sesión se gestiona ahora exclusivamente desde la barra lateral. -->

<div class="promo-banner animate__animated animate__slideInDown" *ngIf="isVisible()">
    <div class="promo-content container">
        <div class="promo-text">
            <span class="badge bg-warning text-dark me-2">OFERTA LIMITADA ⏳</span>
            <span class="main-msg">
                <strong>{{ mensaje() }}</strong> 
                <span class="d-none d-md-inline" *ngIf="!authService.isLoggedIn()">— Solo 100 cupos disponibles</span>
            </span>
            <small class="d-block d-md-inline ms-md-2 opacity-75" *ngIf="!authService.hasActiveSubscription()">
                (Luego $9.990/mes)
            </small>
        </div>
        
        <div class="promo-actions">
            <button class="btn btn-light btn-sm rounded-pill fw-bold px-4 pulse-effect" (click)="action()">
                ¡Quiero mi cupo! 🚀
            </button>
            <button class="btn-close btn-close-white ms-3" aria-label="Close" (click)="cerrar()"></button>
        </div>
    </div>
</div>

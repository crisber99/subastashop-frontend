<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-3">Crear Cuenta 🚀</h3>

    @if (mensajeError) {
        <div class="alert alert-danger">{{ mensajeError }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Nombre Completo</label>
        <input type="text" [(ngModel)]="form.nombre" name="nombre" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" [(ngModel)]="form.email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" [(ngModel)]="form.telefono" name="telefono" class="form-control" placeholder="+56 9..." required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Dirección</label>
          <input type="text" [(ngModel)]="form.direccion" name="direccion" class="form-control" placeholder="Calle, Ciudad" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" [(ngModel)]="form.password" name="password" class="form-control" 
               required minlength="8" placeholder="Mínimo 8 caracteres, letras y números">
        <div class="form-text small">Mínimo 8 caracteres, debe incluir letras y números.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
        {{ cargando ? 'Registrando...' : 'Registrarme' }}
      </button>
    </form>

    <div class="mt-3 text-center">
      <small>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></small>
    </div>
  </div>
</div>

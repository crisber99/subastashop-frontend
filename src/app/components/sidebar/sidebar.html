<nav id="sidebar" class="sidebar" 
     [class.toggled]="layoutService.sidebarOpen()"
     [class.collapsed]="!layoutService.sidebarOpen()">
    <div class="sidebar-brand">
        <a routerLink="/" class="text-decoration-none fw-bold">
            <img src="assets/img/subasta_shop_icon.png" alt="SubastaShop" style="width: 30px; margin-right: 10px;">
            SubastaShop
        </a>
    </div>

    <div class="sidebar-content" *ngIf="menuService.fullMenu().length > 0">
        <ul class="sidebar-nav">
            <li class="sidebar-header">Navegación</li>

            <li class="sidebar-item" *ngFor="let item of menuService.fullMenu()">
                <a class="sidebar-link" [routerLink]="item.route" routerLinkActive="active" 
                   [routerLinkActiveOptions]="{ exact: true }">
                    <i class="bi" [ngClass]="item.icon"></i>
                    <span class="align-middle">{{ item.label }}</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="logout-container">
        <a class="sidebar-link logout-link" (click)="authService.logout()" style="cursor: pointer;">
            <i class="bi bi-box-arrow-left"></i>
            <span class="align-middle">Cerrar Sesión</span>
        </a>
    </div>
</nav>

<!-- Backdrop para versión móvil -->
<div class="sidebar-backdrop d-lg-none" *ngIf="layoutService.sidebarOpen()" 
    (click)="layoutService.toggleSidebar()"
    (keydown)="layoutService.toggleSidebar()" tabindex="0"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999;">
</div>

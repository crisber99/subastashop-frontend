<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blue_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0061ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main Circular Background -->
  <circle cx="256" cy="256" r="230" fill="url(#blue_grad)" />
  
  <!-- White Shopping Cart Outline (Minimalist) -->
  <path d="M140 220 L180 220 L210 380 H380 L410 250 H210" stroke="white" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="230" cy="420" r="20" fill="white" />
  <circle cx="360" cy="420" r="20" fill="white" />
  
  <!-- Auction Gavel (White, Bold, Angled) -->
  <g transform="translate(280, 200) rotate(-40)">
    <!-- Gavel Head -->
    <rect x="-65" y="-35" width="130" height="70" rx="15" fill="white" />
    <rect x="-65" y="-15" width="15" height="30" fill="#f0f9ff" />
    <rect x="50" y="-15" width="15" height="30" fill="#f0f9ff" />
    <!-- Gavel Handle -->
    <rect x="-12" y="35" width="24" height="160" rx="12" fill="white" />
  </g>
  
  <!-- Fire/Spark detail in Orange on the cart back -->
  <path d="M420 220 C440 180 460 180 460 140 C460 110 440 100 420 120 C400 140 410 180 420 220 Z" fill="#fb923c" />
</svg>

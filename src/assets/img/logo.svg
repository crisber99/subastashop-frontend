<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blue_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#blue_grad)" />
  
  <!-- Improved Cart Icon -->
  <path d="M140 160 H180 L220 340 H400 L440 200 H200" stroke="white" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="230" cy="380" r="25" fill="white" />
  <circle cx="360" cy="380" r="25" fill="white" />
  
  <!-- Fire Detail on Cart -->
  <path d="M440 180 C440 180 460 140 460 110 C460 80 430 90 430 110 C430 130 450 150 440 180" fill="#f97316" />
  <path d="M445 175 C445 175 455 145 455 125 C455 105 440 110 440 125 C440 140 450 150 445 175" fill="#fde047" />

  <!-- Auction Gavel (User Style) -->
  <g transform="translate(230, 200) rotate(-35)">
    <!-- Hammer Head -->
    <rect x="-60" y="-30" width="120" height="60" rx="15" fill="white" stroke="#1e40af" stroke-width="5" />
    <rect x="-60" y="-10" width="10" height="20" fill="#e2e8f0" />
    <rect x="50" y="-10" width="10" height="20" fill="#e2e8f0" />
    <!-- Hammer Handle -->
    <rect x="-10" y="30" width="20" height="150" rx="10" fill="white" stroke="#1e40af" stroke-width="5" />
  </g>
</svg>
